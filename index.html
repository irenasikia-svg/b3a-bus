<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B3A Fu Tai ⇄ Shenzhen Bay</title>
<meta name="description" content="B3A 富泰邨 ⇄ 深圳灣口岸 實時到站時間，並可搜尋九巴、龍運及城巴路線（DATA.GOV.HK 開放數據）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Noto+Sans+HK:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="map" role="img" aria-label="路線圖"></div>
<div class="legend glass" id="legend" aria-hidden="true"></div>

<main class="wrap">
  <div class="hero-title glass">
    <span class="route-no" id="title-no">B3A</span>
    <div><h1 id="title-main">富泰 ⇄ 深圳灣口岸</h1><p id="title-sub">城巴 · 實時到站</p></div>
  </div>

  <div class="search glass" role="search">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋九巴或城巴路線，例如 960、B3X、中環" autocomplete="off" autocapitalize="characters" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="搜尋巴士路線">
      <button class="clear" id="clear" type="button" aria-label="清除搜尋" hidden>×</button>
    </div>
    <ul id="results" role="listbox" aria-label="搜尋結果"></ul>
  </div>

  <button class="home glass" id="home" type="button" hidden>← 返回 B3A 富泰看板</button>

  <div class="toolbar glass">
    <span id="status" aria-live="polite">載入中…</span>
    <button id="refresh" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      刷新
    </button>
  </div>

  <div id="board" style="display: contents"></div>

  <footer class="glass">
    <span>資料：九巴、龍運、城巴 · <a href="https://data.gov.hk/tc-data/group/transportation" target="_blank" rel="noopener">DATA.GOV.HK</a>，每 30 秒自動更新</span>
    <span>路線圖為近似走線</span>
  </footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="b3a-route.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
